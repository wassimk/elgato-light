name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component clippy --no-self-update
      - run: rustup default stable
      - run: cargo build
      - run: cargo clippy -- -D warnings
      - run: cargo test

  # Builds the same release binaries as release.yml, without signing or
  # publishing, so pull requests prove the release build still works.
  release-build:
    name: Release Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      BIN: elgato-light
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add "$TARGET"
      - name: Build binary
        env:
          CARGO_PROFILE_RELEASE_STRIP: "true"
        run: cargo build --locked --release --target "$TARGET"
      - name: Check architecture and stripping
        run: |
          BINARY="target/$TARGET/release/$BIN"
          file "$BINARY"
          case "$TARGET" in
            *-apple-darwin)
              EXPECTED_ARCH="${TARGET%%-*}"
              [ "$EXPECTED_ARCH" = "aarch64" ] && EXPECTED_ARCH="arm64"
              [ "$(lipo -archs "$BINARY")" = "$EXPECTED_ARCH" ]
              DEFINED=$(nm -U "$BINARY" | wc -l | tr -d ' ')
              echo "defined symbols: $DEFINED"
              [ "$DEFINED" -le 10 ]
              ;;
            x86_64-*-linux-*)
              file "$BINARY" | grep -q 'x86-64'
              file "$BINARY" | grep -q ', stripped'
              ;;
            aarch64-*-linux-*)
              file "$BINARY" | grep -q 'ARM aarch64'
              file "$BINARY" | grep -q ', stripped'
              ;;
          esac
